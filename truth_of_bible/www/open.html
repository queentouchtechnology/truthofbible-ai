<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Open in Truth of Bible</title>
</head>
<body style="margin:0;background:#f4f5f7;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="padding:48px 16px;">
    <div style="max-width:420px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;text-align:center;">
      <div style="background:#f2a128;padding:24px 32px;">
        <span style="font-size:20px;font-weight:700;color:#ffffff;">Truth of Bible</span>
      </div>
      <div style="padding:36px 32px;">
        {% if has_route %}
        <p style="margin:0 0 24px;font-size:15px;color:#374151;line-height:1.5;">
          Opening this in the Truth of Bible app&hellip;
        </p>
        {% else %}
        <p style="margin:0 0 24px;font-size:15px;color:#374151;line-height:1.5;">
          Get the Truth of Bible app to continue.
        </p>
        {% endif %}
        <a href="{{ play_store_url }}" style="display:inline-block;padding:14px 32px;background:#f2a128;color:#ffffff;border-radius:8px;font-size:15px;font-weight:700;text-decoration:none;">
          Get it on Google Play
        </a>
        <p style="margin:24px 0 0;font-size:13px;color:#9ca3af;line-height:1.5;">
          Already have the app installed? If nothing opened automatically, switch to it from your recent apps.
        </p>
      </div>
    </div>
  </div>

  {% if has_route %}
  <script>
    // One attempt at the app's own URL scheme — if the app isn't installed
    // the browser just ignores this, and the Play Store button above still
    // works either way.
    window.location.href = {{ app_scheme_url | tojson }};
  </script>
  {% endif %}
</body>
</html>
